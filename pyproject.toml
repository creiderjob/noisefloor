[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "creiderjob-noisefloor"
version = "0.1.0"
description = "用重复测量与子集切分估计随机波动幅度，标出低于噪声的分数差"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "creiderjob" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://creiderjob.github.io"
Repository = "https://github.com/creiderjob/noisefloor"
Issues = "https://github.com/creiderjob/noisefloor/issues"

[project.scripts]
noisefloor = "noisefloor:main"

[tool.setuptools]
py-modules = ["noisefloor"]
